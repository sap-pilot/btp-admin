_schema-version: "3.3"
ID: btp-admin
version: 1.4.0

modules:
  - name: btp-admin
    type: nodejs
    path: server
    parameters:
      memory: 2G         # Chrome is memory-hungry — 512M is not enough
      disk-quota: 4G     # Chrome + libs are large
      # docker:
      #   image: sapux/btp-admin:latest
      buildpacks:
        - https://github.com/cloudfoundry/apt-buildpack
        - nodejs_buildpack
      host: btp-admin-${org}-${space}
      enable-ssh: true
      keep-existing:
        env: true
        routes: true
    build-parameters:
      builder: custom
      commands:
        - npm run build:client --prefix ..
        - npm run build:server --prefix ..
      ignore:
        - localStore/
        - pw-browsers/
    requires:
      - name: btp-admin-xsuaa

resources:
  - name: btp-admin-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        xsappname: btp-admin
      path: ./xs-security.json
      service: xsuaa
      service-plan: application